<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, Arial, sans-serif;
            background: #f0f2f5;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            margin-bottom: 1rem;
            color: #333;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover {
            background: #2563eb;
        }
        .info {
            font-size: 0.8rem;
            color: #666;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🔗 页面跳转</h2>
    <button id="jumpBtn">跳转到 localhost:20509/</button>
    <div class="info">点击按钮将跳转到指定页面</div>
</div>

<script>
    // 删除所有 cookie 的方法
    function deleteAllCookies() {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            const eqPos = cookie.indexOf('=');
            const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
            document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        }
        console.log('[Cookie] 已删除所有 cookie');
    }

    // 跳转方法
    function redirectToHome() {
        console.log('[跳转] 准备跳转到 http://localhost:20509/');
        deleteAllCookies();  // 先删除所有 cookie
        window.location.href = 'http://localhost:20509/';
    }

    document.getElementById('jumpBtn').addEventListener('click', redirectToHome);
</script>
</body>
</html>
