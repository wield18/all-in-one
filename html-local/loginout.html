<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登出账户</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, Arial, sans-serif;
            background: #f5f5f5;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 { margin-bottom: 1rem; color: #333; }
        button {
            width: 100%;
            padding: 10px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover { background: #b91c1c; }
        .info { font-size: 0.8rem; color: #666; margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h2>🚪 登出账户</h2>
    <p style="margin-bottom: 1rem; color: #555;">点击下方按钮将退出当前登录状态</p>
    <button id="logoutBtn">立即登出</button>
    <div class="info">⚠️ 操作结果请在控制台查看 (F12)</div>
</div>

<script>
    // 获取cookie
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    // 检查cookie并重定向
    function checkCookieAndRedirect() {
        const userToken = getCookie('user-token');
        const userId = getCookie('id');
        if (!userToken || !userId) {
            console.warn('[登出页] 缺少user-token或id cookie, 跳转至登录页');
            window.location.href = 'http://localhost:20509/login';
            return false;
        }
        return { userToken, userId: parseInt(userId, 10) };
    }

    const cookieValid = checkCookieAndRedirect();
    if (!cookieValid) {
        throw new Error('redirect');
    }

    const userId = cookieValid.userId;
    const userToken = cookieValid.userToken;
    console.log(`[登出页] cookie验证通过, id=${userId}, user-token=${userToken}`);

    // 登出请求
    async function logout() {
        const formBody = new URLSearchParams();
        formBody.append('id', userId);

        console.log('[登出] 发送请求:', { id: userId });

        try {
            const response = await fetch('http://localhost:20509/login-out', {
                method: 'GET',
                headers: {
                    'user-token': userToken,
                },
                credentials: 'include',
            });

            if (response.ok) {
                const text = await response.text();
                console.log('[登出] 响应:', text);
                if (text === 'ok') {
                    console.log('[登出] 成功，跳转至 localhost:20509/');
                    window.location.href = 'http://localhost:20509/';
                } else {
                    console.warn('[登出] 返回非ok:', text);
                }
            } else {
                const text = await response.text();
                console.error('[登出] 请求失败', response.status, text);
            }
        } catch (err) {
            console.error('[登出] 网络错误', err);
        }
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
</script>
</body>
</html>
